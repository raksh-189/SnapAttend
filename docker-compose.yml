services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: attendai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-attendai_dev}
      POSTGRES_DB: attendai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendai -d attendai"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://attendai:${DB_PASSWORD:-attendai_dev}@db:5432/attendai
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-0000000000000000}
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - media:/srv/app/media
      - models:/srv/app/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  models:
